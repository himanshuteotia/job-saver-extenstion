<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Options</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 20px;
      width: 320px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2d72fc;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #174ea6;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      color: #28a745;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Configure Notion</h2>
  <div class="form-group">
    <label for="token">Integration Token</label>
    <input type="text" id="token" placeholder="Enter your Notion integration token" />
  </div>
  <div class="form-group">
    <label for="db">Database ID</label>
    <input type="text" id="db" placeholder="Enter your Notion database ID" />
  </div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
