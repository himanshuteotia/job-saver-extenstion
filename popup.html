<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Saver</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 20px;
      width: 320px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2d72fc;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #174ea6;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h2>Save Job to Notion</h2>
  <div class="form-group">
    <label for="jobTitle">Job Title</label>
    <input type="text" id="jobTitle" placeholder="e.g. Software Engineer" />
  </div>
  <div class="form-group">
    <label for="companyName">Company</label>
    <input type="text" id="companyName" placeholder="e.g. Google" />
  </div>
  <div class="form-group">
    <label for="jobLink">Job Link</label>
    <input type="url" id="jobLink" />
  </div>
  <button id="saveBtn">Save to Notion</button>
  <div class="footer">Made with ❤️ by Himanshu</div>
  <script src="popup.js"></script>
</body>
</html>
